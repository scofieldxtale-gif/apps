name: Build Kasir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cek Flutter
        run: flutter --version

      - name: Buat project Android
        run: |
          flutter create \
            --platforms android \
            --project-name kasirtab \
            --org com.kasirtab \
            kasirtab

      - name: Pasang source kasir
        run: |
          cp lib/main.dart kasirtab/lib/main.dart

      - name: Ambil dependency
        working-directory: kasirtab
        run: flutter pub get

      - name: Analisa source
        working-directory: kasirtab
        run: flutter analyze

      - name: Build APK Release
        working-directory: kasirtab
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KASIR-TAB-APK
          path: kasirtab/build/app/outputs/flutter-apk/app-release.apk
